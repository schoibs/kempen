name: campaign-generator

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_USER: campaign
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - campaign-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.0.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - campaign-redis:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: campaign-local
      MINIO_ROOT_PASSWORD: campaign-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - campaign-minio:/data

volumes:
  campaign-minio:
  campaign-postgres:
  campaign-redis:
